[package]
name = "spqr"
version = "1.5.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.83.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
displaydoc = "0.2"
hax-lib = "0.3.6"
hkdf = "0.12"
libcrux-hmac = "0.0.6"
libcrux-ml-kem = { version = "0.0.8", default-features = false, features = ["incremental", "mlkem768"] }
log = "0.4.21"
num_enum = "0.7.3"
prost = "0.14.1"
rand = "0.9"
rand_core = "0.9"
sha2 = "0.10"
sorted-vec = "0.8.6"
thiserror = "2.0.11"

[dev-dependencies]
# When built directly, auto-enable the test-utils feature.
spqr = { path = ".", features = ["test-utils"] }

env_logger = "0.11"
galois_field_2pm = "0.1.0"
hex = "0.4"
hmac = "0.12.1"
matches = "0.1.10"
proptest = "1.7"
rand_08 = { package = "rand", version = "0.8" }
rand_distr = "0.5.1"

[build-dependencies]
prost-build = "0.14.1"

[features]
proof = []
test-utils = []

[target.'cfg(not(any(windows, target_arch = "x86")))'.dependencies]
# sha2's asm implementation uses standalone .S files that aren't compiled correctly on Windows,
# and aren't linked correctly on x86 Android.
# This will be fixed in sha2 0.11, which also removes the "asm" feature and turns it on by default.
# So when sha2 0.11 is released, this section will go away.
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "x86"))'.dependencies]
cpufeatures = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    # Set automatically by hax only during `into proverif` extraction; gates the
    # ProVerif-specific annotations (pv_extern / proverif::replace_body). Never
    # set in normal builds, so the annotations are inert there.
    'cfg(hax_backend_proverif)',
] }

# NOTE: ProVerif extraction needs the in-tree dev hax-lib for the `pv_extern` /
# `proverif::replace_body` macros, which are not yet on crates.io. The
# annotations are gated on `cfg(hax_backend_proverif)` (set only by hax during
# `into proverif`), NOT a cargo feature — so `cargo build`/`test --all-features`
# never see them. `hax.py extract-proverif` injects the dev hax-lib via
# `cargo --config` (not a committed `[patch.crates-io]`), keeping CI portable.
